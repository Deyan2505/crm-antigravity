# Render Blueprint for the PREVIEW backend only (Stage 2A review). It is NOT used by production: the production service `crm-server` is
# not part of this file, and Render only reads a file named render.yaml automatically - this one is applied by hand:
#   Render dashboard -> New -> Blueprint -> this repo -> branch feature/crm-v2-stage2a-client-hub -> Blueprint path: render-preview.yaml
# Full steps, limits and teardown: server/docs/preview-environment.md
services:
  - type: web
    name: crm-server-preview
    runtime: node
    plan: free              # free instance: no card on file means no charges are possible
    region: oregon          # same region as the Neon test project
    branch: feature/crm-v2-stage2a-client-hub
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      # isolation guard (server/isolation.js): webhooks answer 403, refuses to start with mail / Make.com / Tally secrets, closed CORS
      - key: PREVIEW_ISOLATED
        value: "1"
      - key: NODE_VERSION
        value: "22"
      # only the preview frontend (stable branch address of the Vercel Preview) may call this backend
      - key: CORS_ORIGIN
        value: https://crm-antigravity-git-feature-crm-568b62-deyans-projects-25b056ae.vercel.app
      # generated by Render for this service only: different from production, never visible in the repo or in chat
      - key: JWT_SECRET
        generateValue: true
      # the connection string of the EMPTY Neon test project: pasted by the owner in the dashboard, never stored here
      - key: DATABASE_URL
        sync: false
